services:
  postgres:
    image: postgres:16-alpine
    container_name: subscription-aggregator-postgres
    environment:
      POSTGRES_DB: subscription_aggregator
      POSTGRES_USER: subscription_aggregator
      POSTGRES_PASSWORD: subscription_aggregator_password
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - subscription_aggregator_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subscription_aggregator -d subscription_aggregator"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrate:
    image: migrate/migrate:v4.18.3
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./db/migration:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://subscription_aggregator:subscription_aggregator_password@postgres:5432/subscription_aggregator?sslmode=disable
      - up

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: local
      HTTP_ADDR: :8080
      LOG_LEVEL: debug
      DATABASE_URL: postgres://subscription_aggregator:subscription_aggregator_password@postgres:5432/subscription_aggregator?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  subscription_aggregator_postgres_data:
